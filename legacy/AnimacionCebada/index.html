<!DOCTYPE html>
<!--
  =====================================================================
  AgroCebada FIRA 2026 · Módulo AnimacionCebada · PASO 1 (rediseño visual)
  Escena 3D base del Gemelo Digital de cebada (Hordeum vulgare)
  ---------------------------------------------------------------------
  - Three.js r160 vía importmap (unpkg). Compatible con Live Server.
  - Misma arquitectura: plantaGroup { suelo, tallo, hojas, espiga }
  - Se conservan plantNodes y actualizarNodos3D(atributos) sin cambios
    de firma ni de comportamiento.
  - Solo cambia la apariencia: tallo con nudos, hojas lanceoladas con
    torsión, espiga de espiguillas en 6 hileras con aristas largas.
  =====================================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroCebada FIRA 2026 · Gemelo Digital de Cebada</title>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #dfeaf2; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; }
    #panel { position: fixed; top: 12px; left: 12px; padding: 10px 14px; background: rgba(255,255,255,.88);
      border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.18); font-size: 13px; color: #2b3a2b;
      max-width: 260px; line-height: 1.35; }
    #panel h1 { margin: 0 0 4px; font-size: 15px; }
    #panel small { color: #5b6b5b; }
    #panel .botones { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    #panel button { border: 0; padding: 6px 10px; border-radius: 6px; background: #4f7a2e; color: #fff;
      font-size: 12px; cursor: pointer; }
    #panel button:hover { background: #3d611f; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="panel">
    <h1>Gemelo Digital · Cebada</h1>
    <small>AgroCebada FIRA 2026<br />Arrastra para orbitar, rueda para acercar.</small>
    <div class="botones">
      <button data-etapa="vegetativo">Vegetativo</button>
      <button data-etapa="espigamiento">Espigamiento</button>
      <button data-etapa="madurez">Madurez</button>
      <button data-etapa="reset">Reiniciar</button>
      <button id="btnCrecer">↻ Ver crecimiento</button>
    </div>
    <div id="progreso" style="margin-top:6px;font-size:12px;color:#3d611f"></div>
  </div>

  <script type="module">
    // ===================================================================
    // 0. IMPORTACIONES
    // ===================================================================
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ===================================================================
    // 1. CONSTANTES DE LA PLANTA
    // ===================================================================
    const ALTURA_TALLO_BASE = 2.2;
    const RADIO_TALLO_BASE  = 0.03;   // más estilizado que antes (0.045)

    const COLORES_INICIALES = {
      suelo:  0x5e4128, // tierra húmeda
      tallo:  0x8dbb48, // caña verde-lima
      hojas:  0x5db033, // verde vegetal vivo
      espiga: 0xe2b441  // dorado cálido
    };

    // Utilidades
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
    const rngDe = (s) => { let a = s >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
    const UP = V(0, 1, 0);

    // ===================================================================
    // 2. ESCENA, CÁMARA Y RENDERIZADOR
    // ===================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdfeaf2);
    scene.fog = new THREE.Fog(0xdfeaf2, 12, 30);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3.2, 2.4, 4.2);
    const OBJETIVO_CAMARA = new THREE.Vector3(0, 1.3, 0);
    camera.lookAt(OBJETIVO_CAMARA);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;   // color más natural, sin saturar
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    // Iluminación basada en imagen: reflejos suaves y volumen natural
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // ===================================================================
    // 3. CONTROLES ORBITALES
    // ===================================================================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.target.copy(OBJETIVO_CAMARA);
    controls.minDistance = 1.0;
    controls.maxDistance = 12;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.update();

    // ===================================================================
    // 4. ILUMINACIÓN
    // ===================================================================
    // Ambiente baja: deja que las sombras den volumen
    scene.add(new THREE.AmbientLight(0xffffff, 0.15));
    // Hemisférica: cielo frío arriba, tierra cálida abajo
    scene.add(new THREE.HemisphereLight(0xd6ebff, 0x7a5a36, 0.6));

    // Sol cálido con sombras suaves
    const sol = new THREE.DirectionalLight(0xfff0d0, 2.0);
    sol.position.set(4, 8, 5);
    sol.castShadow = true;
    sol.shadow.mapSize.set(2048, 2048);
    sol.shadow.camera.near = 1;
    sol.shadow.camera.far = 25;
    sol.shadow.camera.left = -4; sol.shadow.camera.right = 4;
    sol.shadow.camera.top = 4;   sol.shadow.camera.bottom = -4;
    sol.shadow.bias = -0.0003;
    sol.shadow.normalBias = 0.015;
    sol.shadow.radius = 3;
    scene.add(sol);

    // Luz de relleno fría, sin sombra: abre las zonas oscuras y marca el contorno
    const relleno = new THREE.DirectionalLight(0xbcd8ff, 0.55);
    relleno.position.set(-5, 3, -4);
    scene.add(relleno);

    // ===================================================================
    // 4b. TEXTURAS PROCEDURALES (canvas, en escala de grises: el color lo da el material)
    // ===================================================================
    function texturaCanvas(w, h, dibujar) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      dibujar(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return t;
    }
    // Fibras longitudinales; con vena=true añade nervadura central clara
    function fibras(seed, n, base, vena) {
      return texturaCanvas(64, 256, (ctx, w, h) => {
        const r = rngDe(seed);
        ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < n; i++) {
          const x = r() * w; ctx.strokeStyle = `rgba(40,50,30,${0.06 + r() * 0.14})`; ctx.lineWidth = 0.5 + r() * 1.3;
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (r() - .5) * 2, h); ctx.stroke();
        }
        if (vena) { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(w / 2 - 1.8, 0, 3.6, h); }
      });
    }
    const texHoja = fibras(11, 34, '#e6e6e6', true);
    const texTallo = fibras(23, 50, '#f0f0f0', false);
    const texSuelo = texturaCanvas(256, 256, (ctx, w, h) => {
      const r = rngDe(47);
      ctx.fillStyle = '#d8d8d8'; ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 5000; i++) {
        const v = r() < 0.5 ? 0 : 255; ctx.fillStyle = `rgba(${v},${v},${v},${0.05 + r() * 0.2})`;
        const s = 0.6 + r() * 2.4; ctx.fillRect(r() * w, r() * h, s, s);
      }
    });
    texSuelo.repeat.set(14, 14);

    // ===================================================================
    // 5. CONSTRUCCIÓN DE LA PLANTA MODULAR
    // ===================================================================
    const plantaGroup = new THREE.Group();
    plantaGroup.name = 'plantaGroup';
    scene.add(plantaGroup);

    // ---------- 5.1 SUELO ----------
    const suelo = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 12),
      new THREE.MeshStandardMaterial({ color: COLORES_INICIALES.suelo, map: texSuelo, bumpMap: texSuelo, bumpScale: 2, roughness: 1 })
    );
    suelo.name = 'suelo';
    suelo.rotation.x = -Math.PI / 2;
    suelo.receiveShadow = true;
    plantaGroup.add(suelo);

    // ---------- 5.2 TALLO (caña con nudos) ----------
    // Tubo con base en y=0 y punta en y=ALTURA_TALLO_BASE (la escala Y sigue funcionando igual).
    const swayX = (t) => -0.14 * t * t;   // curvatura natural del tallo (desplazamiento en X)
    const NUDOS = [0.2, 0.4, 0.58, 0.74];   // posición relativa de los nudos
    function crearGeometriaTallo() {
      const nv = 120, nr = 16, pos = [], nor = [], uv = [], col = [], idx = [];
      for (let j = 0; j <= nv; j++) {
        const t = j / nv;
        let nudo = 0; for (const n of NUDOS) nudo += Math.exp(-Math.pow((t - n) / 0.013, 2));
        nudo = clamp(nudo);
        const base = 1 + 0.9 * Math.exp(-t / 0.025);                    // base ensanchada
        const r = RADIO_TALLO_BASE * (1 - 0.4 * t) * (1 + 0.55 * nudo) * base;
        const sombra = 1 - 0.42 * nudo - 0.1 * t;                       // nudos más oscuros
        for (let k = 0; k <= nr; k++) {
          const a = k / nr * Math.PI * 2, cx = Math.cos(a), sz = Math.sin(a);
          pos.push(cx * r + swayX(t), t * ALTURA_TALLO_BASE, sz * r); nor.push(cx, 0.1, sz);
          uv.push(k / nr, t * 8); col.push(sombra, sombra, sombra);
        }
      }
      for (let j = 0; j < nv; j++) for (let k = 0; k < nr; k++) {
        const a = j * (nr + 1) + k, b = a + 1, c = a + nr + 1, d = c + 1;
        idx.push(a, b, c, b, d, c);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setIndex(idx);
      return g;
    }
    const tallo = new THREE.Mesh(
      crearGeometriaTallo(),
      new THREE.MeshStandardMaterial({ color: COLORES_INICIALES.tallo, map: texTallo, bumpMap: texTallo, bumpScale: 0.8,
        vertexColors: true, roughness: 0.5 })
    );
    tallo.name = 'tallo';
    tallo.castShadow = true;
    tallo.receiveShadow = true;
    plantaGroup.add(tallo);

    // ---------- 5.3 HOJAS ----------
    // Cinta lanceolada: arqueo parabólico, pliegue en V (vena central), torsión y margen ondulado.
    function crearGeometriaHoja(largo, ancho, curvatura, torsion = 0.5, semilla = 1) {
      const nu = 10, nv = 48, pos = [], uv = [], col = [], idx = [];
      const r = rngDe(semilla), fase = r() * 6.28;
      for (let j = 0; j <= nv; j++) {
        const t = j / nv, y = t * largo, zc = curvatura * t * t * largo;     // arqueo parabólico
        const perfil = (0.4 + 0.6 * sstep(0, 0.25, t)) * (1 - Math.pow(Math.max(0, (t - 0.4) / 0.6), 1.9));
        const hw = Math.max(ancho * 0.5 * perfil, 0.0004);
        const psi = torsion * Math.pow(t, 1.4), cp = Math.cos(psi), sp = Math.sin(psi);
        for (let i = 0; i <= nu; i++) {
          const u = i / nu * 2 - 1, x = u * hw;
          const pliegue = 0.5 * u * u * hw * (1 - 0.6 * t);   // canal suave, sin arista
          const onda = 0.006 * Math.sin(t * 20 + fase + u) * u * u * Math.min(1, t * 3);
          pos.push(x * cp, y, zc + pliegue + onda - x * sp);
          uv.push((u + 1) / 2, t);
          const s = (0.84 + 0.16 * (1 - Math.abs(u))) * (1 - 0.1 * t);        // sombreado suave
          col.push(s, s, s);
        }
      }
      for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
        const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }

    // Hoja mate y con nervaduras; doble cara
    const materialHojas = new THREE.MeshPhysicalMaterial({
      color: COLORES_INICIALES.hojas, map: texHoja, bumpMap: texHoja, bumpScale: 1.2,
      vertexColors: true, roughness: 0.5, metalness: 0, side: THREE.DoubleSide,
      sheen: 0.6, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xc8e6a0)
    });

    const hojas = new THREE.Group();
    hojas.name = 'hojas';
    plantaGroup.add(hojas);

    // fraccion: altura donde nace · giro: alrededor del tallo (hojas alternas) · inclinacion: respecto a la vertical
    const DEFINICION_HOJAS = [
      { fraccion: 0.20, giro: 0.0,            inclinacion: 0.95, largo: 1.35, ancho: 0.11, curvatura: 0.55, torsion:  0.6 },
      { fraccion: 0.40, giro: Math.PI * 1.0,  inclinacion: 0.85, largo: 1.30, ancho: 0.11, curvatura: 0.50, torsion: -0.5 },
      { fraccion: 0.58, giro: Math.PI * 0.12, inclinacion: 0.72, largo: 1.10, ancho: 0.10, curvatura: 0.42, torsion:  0.5 },
      { fraccion: 0.74, giro: Math.PI * 1.1,  inclinacion: 0.55, largo: 0.80, ancho: 0.085, curvatura: 0.34, torsion: -0.4 }  // hoja bandera
    ];

    DEFINICION_HOJAS.forEach((def, i) => {
      const pivote = new THREE.Group();
      pivote.name = `hoja_pivote_${i}`;
      pivote.rotation.y = def.giro;
      pivote.position.y = def.fraccion * ALTURA_TALLO_BASE;

      const malla = new THREE.Mesh(
        crearGeometriaHoja(def.largo, def.ancho, def.curvatura, def.torsion, 5 + i * 7),
        materialHojas
      );
      malla.name = `hoja_${i}`;
      malla.rotation.x = def.inclinacion;
      malla.position.z = RADIO_TALLO_BASE * 0.6;     // nace pegada a la superficie del tallo
      malla.castShadow = true;
      malla.receiveShadow = true;

      pivote.userData = { fraccion: def.fraccion, giroBase: def.giro };
      malla.userData  = { inclinacionBase: def.inclinacion };

      pivote.add(malla);
      hojas.add(pivote);
    });

    // ---------- 5.4 ESPIGA ----------
    // Raquis central + espiguillas en 6 hileras (tríadas alternas a cada lado) + aristas largas.
    const espiga = new THREE.Group();
    espiga.name = 'espiga';
    espiga.position.y = ALTURA_TALLO_BASE;
    plantaGroup.add(espiga);

    const materialEspiga = new THREE.MeshStandardMaterial({ color: COLORES_INICIALES.espiga, roughness: 0.5 });
    const materialAristas = new THREE.MeshStandardMaterial({
      color: new THREE.Color(COLORES_INICIALES.espiga).offsetHSL(0, -0.05, 0.1), roughness: 0.55
    });
    const materialRaquis = new THREE.MeshStandardMaterial({
      color: new THREE.Color(COLORES_INICIALES.espiga).offsetHSL(0, -0.1, -0.06), roughness: 0.6
    });

    const LARGO_ESPIGA = 0.45;
    const NODOS_ESPIGA = 20;

    // Raquis: eje delgado que se continúa con el tallo
    const raquis = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.011, LARGO_ESPIGA + 0.03, 8), materialRaquis);
    raquis.name = 'espiga_raquis';
    raquis.position.y = (LARGO_ESPIGA + 0.03) / 2 - 0.02;
    raquis.castShadow = true;
    espiga.add(raquis);

    // Espiguilla: elipsoide puntiagudo (eje Y, longitud 2)
    const geoEspiguilla = new THREE.SphereGeometry(1, 24, 16);
    { const p = geoEspiguilla.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const y = p.getY(i), f = 1 - 0.4 * Math.pow(Math.abs(y), 2.2);
        p.setX(i, p.getX(i) * f); p.setZ(i, p.getZ(i) * f);
      }
      geoEspiguilla.computeVertexNormals(); }
    // Arista: cono muy fino, base en el origen, punta en +Y (longitud 1)
    const geoArista = new THREE.ConeGeometry(0.0026, 1, 4, 1, true);
    geoArista.translate(0, 0.5, 0);

    const nEsp = NODOS_ESPIGA * 3;
    const espiguillas = new THREE.InstancedMesh(geoEspiguilla, materialEspiga, nEsp);
    const aristas = new THREE.InstancedMesh(geoArista, materialAristas, nEsp);
    espiguillas.name = 'espiga_espiguillas'; aristas.name = 'espiga_aristas';
    {
      const r = rngDe(900), d = new THREE.Object3D(), c = new THREE.Color(); let n = 0;
      for (let i = 0; i < NODOS_ESPIGA; i++) {
        const lado = i % 2 ? 1 : -1, a0 = lado > 0 ? 0 : Math.PI;
        const y = 0.03 + i * (LARGO_ESPIGA - 0.07) / NODOS_ESPIGA;
        for (let m = -1; m <= 1; m++) {
          const a = a0 + m * 0.62, out = V(Math.cos(a), 0, Math.sin(a)), tan = V(-Math.sin(a), 0, Math.cos(a));
          const dir = V(0, 1, 0).addScaledVector(out, 0.28).normalize();
          const centro = V(0, y, 0).addScaledVector(out, 0.025).addScaledVector(dir, 0.034);
          // espiguilla
          d.position.copy(centro); d.quaternion.setFromUnitVectors(UP, dir); d.scale.set(0.0125, 0.034, 0.0095); d.updateMatrix();
          espiguillas.setMatrixAt(n, d.matrix);
          const s = 0.88 + r() * 0.2; espiguillas.setColorAt(n, c.setRGB(s, s, s));
          // arista: asciende hacia arriba y afuera, ligera divergencia lateral
          const da = V(0, 1, 0).addScaledVector(out, 0.2 + r() * 0.08).addScaledVector(tan, m * 0.1).normalize();
          d.position.copy(centro).addScaledVector(dir, 0.032); d.quaternion.setFromUnitVectors(UP, da);
          d.scale.set(1, 0.5 + r() * 0.14, 1); d.updateMatrix();
          aristas.setMatrixAt(n, d.matrix);
          const s2 = 0.9 + r() * 0.15; aristas.setColorAt(n, c.setRGB(s2, s2, s2));
          n++;
        }
      }
    }
    espiguillas.castShadow = aristas.castShadow = true;
    espiguillas.receiveShadow = true;
    espiga.add(espiguillas, aristas);

    // ===================================================================
    // 6. OBJETO DE REFERENCIAS A LOS NODOS
    // ===================================================================
    export const plantNodes = { suelo, tallo, hojas, espiga };

    // ---- Semilla (solo visual, para la animación de crecimiento; no forma parte de plantNodes) ----
    const semilla = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16),
      new THREE.MeshStandardMaterial({ color: 0xd2b06a, roughness: 0.6 }));
    semilla.name = 'semilla'; semilla.position.y = 0.02; semilla.rotation.z = 0.15;
    semilla.castShadow = true; plantaGroup.add(semilla);

    // ---- Crecimiento animado ----
    // La API guarda los valores "finales" en `base`; el crecimiento (g: 0 semilla → 1 estado actual)
    // solo los modula. Con g = 1 el resultado es idéntico al de actualizarNodos3D sin animación.
    const base = { tallo: 1, grosor: 1, hojas: 1, espiga: 1, inclin: 0, rotHojas: 0, giro: 0, visEsp: true };
    function registrarBase(a) {
      if (typeof a.escalaTallo === 'number') base.tallo = a.escalaTallo;
      if (typeof a.escalaGrosorTallo === 'number') base.grosor = a.escalaGrosorTallo;
      if (typeof a.escalaHojas === 'number') base.hojas = a.escalaHojas;
      if (typeof a.escalaEspiga === 'number') base.espiga = a.escalaEspiga;
      if (typeof a.inclinacionEspiga === 'number') base.inclin = a.inclinacionEspiga;
      if (typeof a.rotacionHojas === 'number') base.rotHojas = a.rotacionHojas;
      if (typeof a.giroHojas === 'number') base.giro = a.giroHojas;
      if (typeof a.visibleEspiga === 'boolean') base.visEsp = a.visibleEspiga;
    }
    const crec = { g: 1, activo: false, dur: 9 };   // duración en segundos
    const PENDIENTE_PUNTA = 0.125;                    // la espiga continúa la curva del tallo
    function aplicarCrecimiento() {
      const g = crec.g, gT = sstep(0.06, 0.72, g);
      semilla.visible = g < 0.3;
      semilla.scale.set(0.055, 0.025, 0.025).multiplyScalar(Math.max(1 - sstep(0.1, 0.3, g), 0.001));
      tallo.visible = g > 0.05;
      tallo.scale.y = Math.max(base.tallo * gT, 0.01);
      tallo.scale.x = tallo.scale.z = Math.max(base.grosor * (0.45 + 0.55 * gT), 0.01);
      const H = ALTURA_TALLO_BASE * tallo.scale.y;
      hojas.children.forEach((pivote, i) => {
        const malla = pivote.children[0], f = pivote.userData.fraccion;
        const gl = sstep(0.2 + 0.1 * i, 0.5 + 0.1 * i, g);          // las hojas se despliegan en orden
        pivote.visible = gl > 0.01;
        pivote.position.set(swayX(f) * tallo.scale.x, f * H, 0);
        pivote.scale.setScalar(Math.max(base.hojas * gl, 0.001));
        pivote.rotation.y = pivote.userData.giroBase + base.giro;
        malla.rotation.x = (malla.userData.inclinacionBase + base.rotHojas) * (0.1 + 0.9 * gl);  // enrolladas → abiertas
      });
      const ge = sstep(0.7, 1, g);                                   // la espiga emerge al final
      espiga.position.set(swayX(1) * tallo.scale.x, H, 0);
      espiga.scale.setScalar(Math.max(base.espiga * ge, 0.001));
      espiga.rotation.z = PENDIENTE_PUNTA + base.inclin * sstep(0.85, 1, g);
      espiga.visible = base.visEsp && ge > 0.01;
    }

    // ===================================================================
    // 7. FUNCIÓN DE ACTUALIZACIÓN REACTIVA
    // ===================================================================
    /**
     * Actualiza el aspecto de la planta a partir de atributos biofísicos.
     * Todos los campos son OPCIONALES: solo se aplican los que se envíen.
     *
     * @param {Object}  atributos
     * @param {number}  [atributos.escalaTallo]       Factor de altura del tallo (1 = base).
     * @param {number}  [atributos.escalaGrosorTallo] Factor de grosor del tallo.
     * @param {number}  [atributos.escalaHojas]       Factor de tamaño de las hojas.
     * @param {number}  [atributos.rotacionHojas]     Cambio de apertura de hojas (rad, + = más abiertas).
     * @param {number}  [atributos.giroHojas]         Giro global de hojas alrededor del tallo (rad).
     * @param {number}  [atributos.escalaEspiga]      Factor de tamaño de la espiga.
     * @param {number}  [atributos.inclinacionEspiga] Cabeceo de la espiga (rad), p. ej. por peso del grano.
     * @param {number|string} [atributos.colorSuelo]  Color del suelo (hex o CSS).
     * @param {number|string} [atributos.colorTallo]  Color del tallo.
     * @param {number|string} [atributos.colorHojas]  Color de las hojas.
     * @param {number|string} [atributos.colorEspiga] Color de la espiga.
     * @param {boolean} [atributos.visibleEspiga]     Mostrar/ocultar la espiga.
     */
    export function actualizarNodos3D(atributos = {}) {
      const a = atributos;
      registrarBase(a);

      // --- Tallo: altura (escala Y) y grosor (escala X/Z) ---
      if (typeof a.escalaTallo === 'number') {
        tallo.scale.y = Math.max(a.escalaTallo, 0.01);
      }
      if (typeof a.escalaGrosorTallo === 'number') {
        tallo.scale.x = tallo.scale.z = Math.max(a.escalaGrosorTallo, 0.01);
      }

      const alturaActual = ALTURA_TALLO_BASE * tallo.scale.y;

      // --- Hojas: reposicionar sobre el tallo, escalar, abrir y girar ---
      hojas.children.forEach((pivote) => {
        const malla = pivote.children[0];
        pivote.position.y = pivote.userData.fraccion * alturaActual;

        if (typeof a.escalaHojas === 'number') {
          pivote.scale.setScalar(Math.max(a.escalaHojas, 0.01));
        }
        if (typeof a.rotacionHojas === 'number') {
          malla.rotation.x = malla.userData.inclinacionBase + a.rotacionHojas;
        }
        if (typeof a.giroHojas === 'number') {
          pivote.rotation.y = pivote.userData.giroBase + a.giroHojas;
        }
      });

      // --- Espiga: siempre en la cúspide del tallo ---
      espiga.position.y = alturaActual;
      if (typeof a.escalaEspiga === 'number') {
        espiga.scale.setScalar(Math.max(a.escalaEspiga, 0.01));
      }
      if (typeof a.inclinacionEspiga === 'number') {
        espiga.rotation.z = a.inclinacionEspiga;
      }
      if (typeof a.visibleEspiga === 'boolean') {
        espiga.visible = a.visibleEspiga;
      }

      // --- Colores (aceptan hex numérico o cadena CSS) ---
      if (a.colorSuelo  !== undefined) suelo.material.color.set(a.colorSuelo);
      if (a.colorTallo  !== undefined) tallo.material.color.set(a.colorTallo);
      if (a.colorHojas  !== undefined) materialHojas.color.set(a.colorHojas);
      if (a.colorEspiga !== undefined) {
        materialEspiga.color.set(a.colorEspiga);
        materialAristas.color.set(a.colorEspiga).offsetHSL(0, -0.05, 0.1);
        materialRaquis.color.set(a.colorEspiga).offsetHSL(0, -0.1, -0.06);
      }
      aplicarCrecimiento();
    }

    window.plantNodes = plantNodes;
    window.actualizarNodos3D = actualizarNodos3D;

    // ===================================================================
    // 8. ETAPAS DE PRUEBA (botones del panel)
    // ===================================================================
    const ETAPAS_PRUEBA = {
      vegetativo: {
        escalaTallo: 0.45, escalaGrosorTallo: 0.8, escalaHojas: 0.8,
        rotacionHojas: -0.2, escalaEspiga: 0.01, visibleEspiga: false,
        inclinacionEspiga: 0,
        colorTallo: 0x9ccd52, colorHojas: 0x66bb36, colorEspiga: 0x9ccc4a
      },
      espigamiento: {
        escalaTallo: 0.85, escalaGrosorTallo: 1, escalaHojas: 1,
        rotacionHojas: 0, escalaEspiga: 0.8, visibleEspiga: true,
        inclinacionEspiga: 0,
        colorTallo: 0x86b545, colorHojas: 0x58ad30, colorEspiga: 0x9ccc4a
      },
      madurez: {
        escalaTallo: 1, escalaGrosorTallo: 1.05, escalaHojas: 0.9,
        rotacionHojas: 0.25, escalaEspiga: 1.15, visibleEspiga: true,
        inclinacionEspiga: 0.35,
        colorTallo: 0xd9bf62, colorHojas: 0xc2ad50, colorEspiga: 0xe2b441
      },
      reset: {
        escalaTallo: 1, escalaGrosorTallo: 1, escalaHojas: 1,
        rotacionHojas: 0, giroHojas: 0, escalaEspiga: 1, visibleEspiga: true,
        inclinacionEspiga: 0,
        colorTallo: COLORES_INICIALES.tallo, colorHojas: COLORES_INICIALES.hojas,
        colorEspiga: COLORES_INICIALES.espiga, colorSuelo: COLORES_INICIALES.suelo
      }
    };

    document.querySelectorAll('#panel button[data-etapa]').forEach((btn) => {
      btn.addEventListener('click', () => {
        actualizarNodos3D(ETAPAS_PRUEBA[btn.dataset.etapa]);
      });
    });

    // ===================================================================
    // 9. REDIMENSIONAMIENTO DE VENTANA
    // ===================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===================================================================
    // 10. BUCLE DE RENDERIZADO
    // ===================================================================
    const reloj = new THREE.Clock();
    let interactuo = false;
    controls.addEventListener('start', () => { interactuo = true; });
    const progreso = document.getElementById('progreso');
    function iniciarCrecimiento() { crec.g = 0; crec.activo = true; crec.espera = 0.8; interactuo = false; }
    window.iniciarCrecimiento = iniciarCrecimiento;
    document.getElementById('btnCrecer').addEventListener('click', iniciarCrecimiento);

    function animar() {
      requestAnimationFrame(animar);
      const dt = Math.min(reloj.getDelta(), 0.1);
      if (crec.activo) {
        if (crec.espera > 0) crec.espera -= dt; else crec.g = Math.min(1, crec.g + dt / crec.dur);
        if (crec.g >= 1) crec.activo = false;
        aplicarCrecimiento();
        progreso.textContent = crec.activo ? 'Creciendo… ' + Math.round(crec.g * 100) + '%' : '';
        if (!interactuo) {                                    // la cámara acompaña el crecimiento
          const k = sstep(0.05, 0.95, crec.g);
          controls.target.y = 0.3 + (OBJETIVO_CAMARA.y - 0.3) * k;
          const dir = camera.position.clone().sub(controls.target).normalize();
          camera.position.copy(controls.target).addScaledVector(dir, 1.8 + 3.6 * k);
        }
      }
      controls.update();
      renderer.render(scene, camera);
    }
    plantaGroup.traverse((o) => { if (o.material && o !== suelo) o.material.envMapIntensity = 0.45; });
    suelo.material.envMapIntensity = 0.25;
    iniciarCrecimiento();
    aplicarCrecimiento();
    animar();
  </script>
</body>
</html>
